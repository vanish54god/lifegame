# Запуск на VPS:  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/game.db
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - ./data:/data          # тут лежит game.db — твой прогресс
    expose:
      - "8000"                # наружу не торчит, только через Caddy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"                                   # нужен для получения сертификата
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"   # если 443 занят (VPN) — ставь HTTPS_PORT=8443
    environment:
      DOMAIN: ${DOMAIN}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
